<script>
    // ============================================
    // CONFIGURAÇÕES
    // ============================================
    const TOTAL_VAGAS = 20;
    
    // Tarifas convertidas para valor por MINUTO (R$/minuto)
    // Categoria 1 (Passeio): R$ 10,00/h -> ~R$ 0,167/min
    // Categoria 2 (Moto): R$ 5,00/h -> ~R$ 0,083/min
    // Categoria 3 (Utilitário): R$ 15,00/h -> ~R$ 0,250/min
    const TARIFAS_POR_MINUTO = { 
      "1": 10.00 / 60, 
      "2": 5.00 / 60, 
      "3": 15.00 / 60 
    };

    const CARROS_LUXO = [
      { placa: 'ABC-1234', modelo: 'Rolls-Royce Phantom' },
      { placa: 'DEF-5678', modelo: 'Bentley Continental GT' },
      { placa: 'GHI-9012', modelo: 'Ferrari SF90 Stradale' },
      { placa: 'JKL-3456', modelo: 'Lamborghini Aventador' },
      { placa: 'MNO-7890', modelo: 'Porsche 911 Turbo S' },
      { placa: 'PQR-2345', modelo: 'Aston Martin DBS' },
      { placa: 'STU-6789', modelo: 'McLaren 720S' },
      { placa: 'VWX-0123', modelo: 'Bugatti Chiron' },
      { placa: 'YZA-4567', modelo: 'Mercedes-Maybach S-Class' },
      { placa: 'BCD-8901', modelo: 'BMW 7 Series' },
    ];

    // ============================================
    // ESTADO
    // ============================================
    let patios = JSON.parse(localStorage.getItem('flashpark_patio')) || [];
    let faturamento = parseFloat(localStorage.getItem('flashpark_caixa')) || 0;
    let placasAutorizadas = JSON.parse(localStorage.getItem('flashpark_placas')) || [];
    let vCheckoutIdx = null;

    // ============================================
    // ELEMENTOS DOM
    // ============================================
    const formEntrada = document.getElementById('form-entrada');
    const formCadastro = document.getElementById('form-cadastro-placa');
    const inputPlaca = document.getElementById('placa');
    const inputNovaPlaca = document.getElementById('nova-placa');
    const inputModelo = document.getElementById('modelo');
    const btnEntrada = document.getElementById('btn-entrada');

    // ============================================
    // FUNÇÕES DE VALIDAÇÃO
    // ============================================
    function validarFormatoPlaca(placa) {
      const padraoAntigo = /^[A-Z]{3}-?[0-9]{4}$/;
      const padraoMercosul = /^[A-Z]{3}[0-9][A-Z][0-9]{2}$/;
      const placaLimpa = placa.replace(/-/g, '');
      return padraoAntigo.test(placaLimpa) || padraoMercosul.test(placaLimpa);
    }

    function placaIsAutorizada(placa) {
      return placasAutorizadas.includes(placa.toUpperCase().trim());
    }

    function placaIsOcupada(placa) {
      return patios.some(v => v.placa === placa.toUpperCase().trim());
    }

    // ============================================
    // VALIDAÇÃO EM TEMPO REAL
    // ============================================
    function validarPlacaEmTempoReal() {
      const placa = inputPlaca.value.toUpperCase().trim();
      const statusDiv = document.getElementById('placa-status');
      const mensagemDiv = document.getElementById('placa-mensagem');

      if (placa.length === 0) {
        inputPlaca.className = 'input-luxo font-mono uppercase';
        statusDiv.classList.add('hidden');
        mensagemDiv.classList.add('hidden');
        btnEntrada.disabled = false;
        return;
      }

      if (!validarFormatoPlaca(placa)) {
        inputPlaca.className = 'input-luxo font-mono uppercase error';
        statusDiv.classList.add('hidden');
        mensagemDiv.classList.remove('hidden');
        mensagemDiv.className = 'text-[10px] mt-1 text-rose-400';
        mensagemDiv.textContent = '⚠️ Formato inválido';
        btnEntrada.disabled = true;
        return;
      }

      if (placaIsOcupada(placa)) {
        const veiculoAtual = patios.find(v => v.placa === placa);
        inputPlaca.className = 'input-luxo font-mono uppercase error';
        statusDiv.classList.add('hidden');
        mensagemDiv.classList.remove('hidden');
        mensagemDiv.className = 'text-[10px] mt-1 text-rose-400';
        mensagemDiv.textContent = `⚠️ Placa já no pátio (${veiculoAtual ? veiculoAtual.modelo : 'Veículo'})`;
        btnEntrada.disabled = true;
        return;
      }

      inputPlaca.className = 'input-luxo font-mono uppercase success';
      statusDiv.classList.remove('hidden');
      mensagemDiv.classList.remove('hidden');

      if (placaIsAutorizada(placa)) {
        mensagemDiv.className = 'text-[10px] mt-1 text-emerald-400';
        mensagemDiv.textContent = '✅ Autorizada';
        btnEntrada.disabled = false;
      } else {
        mensagemDiv.className = 'text-[10px] mt-1 text-amber-400';
        mensagemDiv.textContent = '⚠️ Não autorizada';
        btnEntrada.disabled = false;
      }
    }

    // Máscara automática para placa
    inputPlaca.addEventListener('input', function(e) {
      let valor = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (valor.length > 3 && valor.length <= 7) {
        valor = valor.substring(0, 3) + '-' + valor.substring(3);
      }
      this.value = valor;
      validarPlacaEmTempoReal();
    });

    inputNovaPlaca.addEventListener('input', function(e) {
      let valor = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (valor.length > 3 && valor.length <= 7) {
        valor = valor.substring(0, 3) + '-' + valor.substring(3);
      }
      this.value = valor;
    });

    // ============================================
    // PLACAS AUTORIZADAS
    // ============================================
    function adicionarPlaca(placa) {
      const placaLimpa = placa.toUpperCase().trim();
      if (!placaLimpa) { mostrarToast('error', 'Erro', 'Digite uma placa.'); return false; }
      if (!validarFormatoPlaca(placaLimpa)) { mostrarToast('error', 'Erro', 'Formato inválido.'); return false; }
      if (placasAutorizadas.includes(placaLimpa)) { mostrarToast('warning', 'Aviso', 'Já cadastrada.'); return false; }
      
      placasAutorizadas.push(placaLimpa);
      salvarEstado();
      renderizarPlacasAutorizadas();
      mostrarToast('success', 'Sucesso', `Placa ${placaLimpa} autorizada.`);
      return true;
    }

    function removerPlaca(placa) {
      if (placaIsOcupada(placa)) {
        mostrarToast('error', 'Erro', 'Veículo está no pátio!');
        return;
      }
      placasAutorizadas = placasAutorizadas.filter(p => p !== placa);
      salvarEstado();
      renderizarPlacasAutorizadas();
      mostrarToast('info', 'Info', `Placa ${placa} removida.`);
    }

    function limparTodasPlacas() {
      const emUso = placasAutorizadas.filter(p => patios.some(v => v.placa === p));
      if (emUso.length > 0) {
        mostrarToast('error', 'Erro', `Placas em uso: ${emUso.join(', ')}`);
        return;
      }
      if (placasAutorizadas.length === 0) { mostrarToast('warning', 'Aviso', 'Nenhuma placa.'); return; }
      if (confirm(`Remover ${placasAutorizadas.length} placas?`)) {
        placasAutorizadas = [];
        salvarEstado();
        renderizarPlacasAutorizadas();
        mostrarToast('success', 'Sucesso', 'Todas removidas.');
      }
    }

    function importarCarrosLuxo() {
      let adicionadas = 0;
      CARROS_LUXO.forEach(({ placa }) => {
        if (!placasAutorizadas.includes(placa)) {
          placasAutorizadas.push(placa);
          adicionadas++;
        }
      });
      salvarEstado();
      renderizarPlacasAutorizadas();
      mostrarToast('success', 'Sucesso', `${adicionadas} carros de luxo importados!`);
    }

    function renderizarPlacasAutorizadas() {
      const container = document.getElementById('lista-placas-autorizadas');
      const total = document.getElementById('total-placas');
      
      total.textContent = placasAutorizadas.length;
      
      if (placasAutorizadas.length === 0) {
        container.innerHTML = `
          <div class="text-center py-4 text-white/20 text-xs">
            <i class="fa-solid fa-inbox text-2xl block mb-1 opacity-30"></i>
            Nenhuma placa autorizada
          </div>
        `;
        return;
      }
      
      container.innerHTML = placasAutorizadas.map(p => {
        const ocupado = patios.some(v => v.placa === p);
        return `
          <div class="badge-placa">
            <span>
              ${p}
              ${ocupado ? '<span class="ocupado"><i class="fa-solid fa-circle"></i> ocupado</span>' : ''}
            </span>
            <button onclick="removerPlaca('${p}')" class="remove-btn">
              <i class="fa-solid fa-times"></i>
            </button>
          </div>
        `;
      }).join('');
    }

    // ============================================
    // TOAST
    // ============================================
    function mostrarToast(tipo, titulo, mensagem) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      const titleEl = document.getElementById('toast-title');
      const msgEl = document.getElementById('toast-message');
      
      const icones = {
        success: '<i class="fa-solid fa-check-circle text-emerald-400"></i>',
        error: '<i class="fa-solid fa-circle-xmark text-rose-400"></i>',
        warning: '<i class="fa-solid fa-triangle-exclamation text-amber-400"></i>',
        info: '<i class="fa-solid fa-circle-info text-indigo-400"></i>'
      };
      
      icon.innerHTML = icones[tipo] || icones.info;
      titleEl.textContent = titulo;
      msgEl.textContent = mensagem;
      
      toast.classList.remove('toast-hidden');
      clearTimeout(toast._timeout);
      toast._timeout = setTimeout(() => {
        toast.classList.add('toast-hidden');
      }, 4000);
    }

    // ============================================
    // ENTRADA DE VEÍCULO
    // ============================================
    formEntrada.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const placa = inputPlaca.value.toUpperCase().trim();
      const modelo = inputModelo.value.trim();
      
      if (!placa) { mostrarToast('error', 'Erro', 'Digite a placa.'); return; }
      if (!validarFormatoPlaca(placa)) { mostrarToast('error', 'Erro', 'Formato inválido.'); return; }
      
      if (placaIsOcupada(placa)) { 
        const veiculoExistente = patios.find(v => v.placa === placa);
        mostrarToast('error', 'Erro', `A placa ${placa} já pertence ao veículo "${veiculoExistente.modelo}".`); 
        return; 
      }

      if (patios.length >= TOTAL_VAGAS) { mostrarToast('error', 'Erro', 'Pátio lotado!'); return; }
      
      if (!placaIsAutorizada(placa)) {
        if (!confirm(`Placa "${placa}" não está autorizada. Deseja adicioná-la?`)) {
          return;
        }
        placasAutorizadas.push(placa);
        salvarEstado();
        renderizarPlacasAutorizadas();
      }
      
      const vagasOcupadas = patios.map(v => v.vaga);
      let vagaLivre = 1;
      while (vagasOcupadas.includes(vagaLivre)) vagaLivre++;
      
      patios.push({
        vaga: vagaLivre,
        placa: placa,
        modelo: modelo,
        categoria: document.getElementById('categoria').value,
        entrada: new Date().toISOString()
      });
      
      salvarEstado();
      formEntrada.reset();
      inputPlaca.className = 'input-luxo font-mono uppercase';
      document.getElementById('placa-status').classList.add('hidden');
      document.getElementById('placa-mensagem').classList.add('hidden');
      btnEntrada.disabled = false;
      
      atualizar();
      renderizarPlacasAutorizadas();
      mostrarToast('success', 'Entrada Registrada', `${placa} (${modelo}) - Vaga #${vagaLivre}`);
    });

    // ============================================
    // CADASTRO DE NOVA PLACA
    // ============================================
    formCadastro.addEventListener('submit', (e) => {
      e.preventDefault();
      const placa = inputNovaPlaca.value.toUpperCase().trim();
      if (adicionarPlaca(placa)) {
        inputNovaPlaca.value = '';
      }
    });

    // ============================================
    // CHECKOUT E MODAL (CÁLCULO POR MINUTO)
    // ============================================
    function calcularCobranca(veiculo) {
      const agora = new Date();
      const entrada = new Date(veiculo.entrada);
      const diffMs = agora - entrada;
      const diffMinutos = Math.max(1, Math.ceil(diffMs / (1000 * 60)));
      const tarifaMinuto = TARIFAS_POR_MINUTO[veiculo.categoria] || (10.00 / 60);
      
      const isIsento = diffMinutos <= 15;
      const valorTotal = isIsento ? 0 : diffMinutos * tarifaMinuto;

      return {
        diffMinutos,
        isIsento,
        valorTotal
      };
    }

    function abrirCheckout(idx) {
      vCheckoutIdx = idx;
      const veiculo = patios[idx];
      const { diffMinutos, isIsento, valorTotal } = calcularCobranca(veiculo);

      document.getElementById('modal-placa').innerText = veiculo.placa;
      document.getElementById('modal-tempo').innerText = `${diffMinutos} min`;
      document.getElementById('modal-tolerancia').innerText = isIsento ? 'Isento (Até 15 min)' : 'Não aplicável';
      document.getElementById('modal-valor').innerText = `R$ ${valorTotal.toFixed(2)}`;

      document.getElementById('modal-checkout').classList.remove('hidden');
    }

    function fecharModal() {
      document.getElementById('modal-checkout').classList.add('hidden');
      vCheckoutIdx = null;
    }

    function confirmarSaida() {
      if (vCheckoutIdx === null) return;
      
      const veiculo = patios[vCheckoutIdx];
      const { valorTotal } = calcularCobranca(veiculo);

      faturamento += valorTotal;
      patios.splice(vCheckoutIdx, 1);
      
      salvarEstado();
      fecharModal();
      atualizar();
      renderizarPlacasAutorizadas();
      mostrarToast('success', 'Saída Registrada', `Pagamento de R$ ${valorTotal.toFixed(2)} confirmado.`);
    }

    // ============================================
    // SALVAR ESTADO
    // ============================================
    function salvarEstado() {
      localStorage.setItem('flashpark_patio', JSON.stringify(patios));
      localStorage.setItem('flashpark_caixa', faturamento.toString());
      localStorage.setItem('flashpark_placas', JSON.stringify(placasAutorizadas));
    }

    // ============================================
    // RENDERIZAÇÃO
    // ============================================
    function atualizar() {
      renderizarKPIs();
      renderizarMapa();
      renderizarTabela();
    }

    function renderizarKPIs() {
      document.getElementById('kpi-total').innerText = TOTAL_VAGAS;
      document.getElementById('kpi-ocupadas').innerText = patios.length;
      document.getElementById('kpi-livres').innerText = TOTAL_VAGAS - patios.length;
      document.getElementById('kpi-faturamento').innerText = `R$ ${faturamento.toFixed(2)}`;
      document.getElementById('total-veiculos').textContent = patios.length;
    }

    function renderizarMapa() {
      const grid = document.getElementById('grid-vagas');
      grid.innerHTML = '';

      for (let i = 1; i <= TOTAL_VAGAS; i++) {
        const veiculo = patios.find(v => v.vaga === i);
        const card = document.createElement('div');
        
        if (veiculo) {
          card.className = "vaga-card vaga-ocupada";
          card.onclick = () => abrirCheckout(patios.indexOf(veiculo));
          card.innerHTML = `
            <span class="text-[10px] block text-gold/50 font-bold">VAGA ${i}</span>
            <span class="font-mono text-xs font-bold placa-text">${veiculo.placa}</span>
            <span class="text-[8px] block text-white/30 mt-0.5 truncate max-w-full">${veiculo.modelo}</span>
          `;
        } else {
          card.className = "vaga-card vaga-livre";
          card.innerHTML = `
            <span class="vaga-number">VAGA ${i}</span>
            <span class="text-xs status-text">LIVRE</span>
          `;
        }
        grid.appendChild(card);
      }
    }

    function renderizarTabela() {
      const tbody = document.getElementById('tabela-veiculos');
      const busca = document.getElementById('busca').value.toLowerCase();
      const empty = document.getElementById('empty-state');
      
      tbody.innerHTML = '';

      const filtrados = patios.filter(v => 
        v.placa.toLowerCase().includes(busca) || 
        v.modelo.toLowerCase().includes(busca)
      );

      if (filtrados.length === 0) {
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        filtrados.forEach((veiculo) => {
          const idxReal = patios.indexOf(veiculo);
          const horaEntrada = new Date(veiculo.entrada).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><span class="text-gold font-bold">#${veiculo.vaga}</span></td>
            <td><span class="font-mono font-bold text-white/90">${veiculo.placa}</span></td>
            <td>${veiculo.modelo}</td>
            <td>${horaEntrada}</td>
            <td class="text-right">
              <button onclick="abrirCheckout(${idxReal})" class="btn-luxo-outline text-xs py-1 px-3">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Saída
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    // Inicialização
    atualizar();
    renderizarPlacasAutorizadas();
  </script>
</body>
</html>
